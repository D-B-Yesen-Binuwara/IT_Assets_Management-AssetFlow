spring.application.name=AssetsFlow

spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AssetsFlow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.security.jwt-secret=${JWT_SECRET:dev-only-change-this-assetflow-jwt-secret-01234567890123456789}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.security.cookie-name=${AUTH_COOKIE_NAME:ASSETFLOW_AUTH}
app.security.cookie-secure=${COOKIE_SECURE:false}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
